line-length = 100
target-version = "py311"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert is fine in tests
    "S603",   # subprocess call is fine for our node_helpers
    "B008",   # function calls in defaults are fine for Typer
    "SIM108", # ternary; readability > terseness sometimes
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S", "E501"]
"scripts/auth.py" = ["S105", "S106"]  # password-looking strings in docs

[lint.isort]
known-first-party = ["scripts"]

[format]
quote-style = "double"
indent-style = "space"
