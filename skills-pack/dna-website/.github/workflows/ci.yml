name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Install Node deps
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Lint
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Smoke tests
        run: pytest tests/test_smoke.py -v

      - name: Unit tests with coverage
        run: pytest --cov=scripts --cov-report=xml --cov-report=term -m "not integration"

      - name: Integration tests
        run: pytest -m integration -v

      - name: Doctor
        run: python -m scripts.doctor

      - name: Verify no credentials in tracked files
        run: |
          ! grep -rEn "password\s*[:=]\s*['\"][^'\"]{3,}|api[_-]?key\s*[:=]\s*['\"][^'\"]{8,}" \
            scripts tests || (echo "✗ Found credential-shaped string in source"; exit 1)

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
